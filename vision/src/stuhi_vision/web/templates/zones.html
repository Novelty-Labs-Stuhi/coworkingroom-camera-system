<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stuhi zones</title>
  <link rel="stylesheet" href="/static/app.css?v={{ assets }}">
  <link rel="stylesheet" href="/static/nav.css?v={{ assets }}">
</head>
<body>
  {% include "nav.html" %}
  <header>
    <h1>Where is the doorframe?</h1>
    
    
    
  </header>

  <div id="cameras"></div>

  <template id="camera-template">
    <section class="camera">
      <h2 class="name"></h2>
      <p class="state"></p>
      <div class="shot">
        <img class="live" alt="live view from this camera">
        <div class="zone-box" hidden></div>
      </div>
      <p class="age"></p>
      <p class="numbers"></p>
      <div class="actions">
        <button type="button" class="save" disabled>Save zone</button>
        <button type="button" class="remove" disabled>Remove zone</button>
        <button type="button" class="refresh">Refresh frame</button>
      </div>
      <p class="result" role="status"></p>
    </section>
  </template>

  <script src="/static/zones.js?v={{ assets }}"></script>
</body>
</html>
