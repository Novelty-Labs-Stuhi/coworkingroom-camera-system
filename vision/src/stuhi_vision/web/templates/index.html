<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>stuhi labelling</title>
  <link rel="stylesheet" href="/static/app.css?v={{ assets }}">
  <link rel="stylesheet" href="/static/nav.css?v={{ assets }}">
</head>
<body>
  {% include "nav.html" %}
  <header>
    <h1>Who came through?</h1>
    
    
  </header>

  <section id="people-panel">
    <h2>Enrolled</h2>
    <ul id="people" class="people"></ul>
    <p class="empty" id="people-empty">Nobody yet. The first label creates the gallery.</p>
    
    <p class="result" id="rename-result" role="status"></p>
    <p class="hint" id="showing" role="status" hidden></p>
  </section>

  <nav id="which" class="which">
    <button type="button" class="pick chosen" data-pile="unchecked_unknown">
      Needs a name <span class="count"></span></button>
    <button type="button" class="pick" data-pile="unchecked_named">
      Guessed <span class="count"></span></button>
    <button type="button" class="pick" data-pile="recheck">
      Worth rechecking <span class="count"></span></button>
    <button type="button" class="pick" data-pile="checked_unknown">
      Left unknown <span class="count"></span></button>
    <button type="button" class="pick" data-pile="checked">
      All checked <span class="count"></span></button>
    <button type="button" class="pick" data-pile="renamed_exits">
      Exits the room renamed <span class="count"></span></button>
    <button type="button" class="pick" data-pile="missing_exits">
      Came in, never left <span class="count"></span></button>
  </nav>

  <p class="hint" id="about-pile"></p>

  <p class="hint" id="sorting">
    Order:
    <button type="button" class="sort chosen" data-sort="latest">newest first</button>
    <button type="button" class="sort" data-sort="odd">least like that person first</button>
  </p>

  <div id="cards" class="grid"></div>
  <p class="empty" id="cards-empty">Nothing here.</p>

  <section id="thin-panel">
    <h2>Needs more examples</h2>
    
    <ul id="thin" class="people"></ul>
    <p class="empty" id="thin-empty">Everyone has enough.</p>
  </section>

  <template id="card-template">
    <article class="card">
      <!-- A still is what you label from: one glance, nothing moving, no waiting. Several
           autoplaying clips at once also made the page jump about. The clip stays one click
           away for when the still is ambiguous. -->
      <img class="face" alt="the face this sighting was recognised from">
      <details class="clip">
        <summary>watch the clip</summary>
        <video controls muted loop playsinline preload="none"></video>
      </details>
      <div class="meta">
        <span class="direction"></span>
        <span class="score"></span>
        <span class="group" hidden></span>
      </div>
      <p class="current"></p>
      <p class="why" hidden></p>
      <div class="together" hidden></div>
      <form class="label-form">
        <!-- The names are on a button rather than only in a datalist: a datalist needs
             typing to open, and the answer is usually one of the last few people through. -->
        <span class="picker">
          <input class="name" type="text" list="known-names" placeholder="name"
                 autocomplete="off" spellcheck="false" required>
          <button type="button" class="choose" title="pick from recent names"
                  aria-label="pick from recent names">&#9662;</button>
          <ul class="choices" hidden></ul>
        </span>
        <button type="submit">Save</button>
        <button type="button" class="reject" title="Unusable clip: remove from the gallery">
          Reject
        </button>
      </form>
      <!-- Why it was rejected, in your words. It stays with the record, so somebody working
           on the detector can read what it is actually getting wrong. -->
      <form class="rejecting" hidden>
        <input class="note" type="text" placeholder="why? e.g. back of a head, the door"
               autocomplete="off">
        <button type="submit">Reject</button>
        <button type="button" class="cancel reject">Cancel</button>
      </form>
      <p class="result" role="status"></p>
    </article>
  </template>

  <datalist id="known-names"></datalist>

  <script src="/static/app.js?v={{ assets }}"></script>
</body>
</html>
