# Copy to config.toml and adjust for your cameras. All coordinates are in pixels of that
# camera's image, with (0, 0) at the top-left.

# One [[camera]] block per camera. With a camera on each side of a doorway, both see every
# passage -- so give each the direction it can actually see faces for, and it ignores the
# other. That is what stops one person being counted twice, and it means both entries and
# exits are named by a face rather than guessed from a body.
[[camera]]
name = "door-in"                              # identifies it in events and in the UI
kind = "stream"                               # file | webcam | stream
target = "http://192.168.8.229:81/stream"
rotate = 180                                  # 0/90/180/270: detection fails on an inverted frame
line_a = [300, 0]                             # the threshold line, two endpoints
line_b = [300, 480]
inside_side = "left"                          # which side of a -> b is inside the office
announce = "in"                               # in | out | both -- what this camera films

# The opposite camera sees the same doorway mirrored, so inside_side flips. Draw its line
# from its own footage: `stuhi-vision calibrate` writes a frame with the line on it.
# [[camera]]
# name = "door-out"
# target = "http://192.168.8.230:81/stream"
# rotate = 0
# line_a = [160, 0]
# line_b = [160, 240]
# inside_side = "right"
# announce = "out"

[thresholds]
detection_conf = 0.4    # minimum YOLO confidence to treat a detection as a person
face_match = 0.35       # minimum cosine similarity to accept a face as a known person
face_margin = 0.05      # best name must beat the runner-up by this, else "unknown"
exit_similarity = 0.6   # minimum cosine similarity to link an exit to an occupant
exit_margin = 0.05      # winner must beat the runner-up by this, else exit is ambiguous
min_track_age = 2       # frames a track must exist before its crossing counts (anti-flicker)

[performance]
# YOLO inference resolution. 640 costs ~440 ms/frame on a CPU without AVX2 against
# ~200 ms at 320, and a doorway sees people close up. Raise only if people are missed.
detect_model = "yolov8n.pt"  # an ONNX export is faster on CPU: see tools/export_onnx.py
detect_imgsz = 320
buffer_capacity = 64        # frames the reader may bank while the models work
face_workers = 4            # threads embedding faces concurrently
motion_min_fraction = 0.004 # fraction of the frame that must change to run the models
crop_padding = 0.35         # padding around the doorway line for the detection crop; 0 = whole frame
clip_frames = 48            # pre-roll frames: the approach to the crossing
clip_clear_frames = 10      # people-free frames before the clip is cut, so it has an ending
clip_max_frames = 200       # hard cap, so a loiterer cannot hold a clip open forever

[web]
# The labelling UI, served from inside the pipeline process so it shares the live gallery.
enabled = true
host = "0.0.0.0"
port = 8800

[paths]
gallery_dir = "gallery"
database = "data/occupancy.db"
review_dir = "data/review"
